name: PR Check

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality checks
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test with coverage
        run: bun run test:coverage

      - name: List changed TypeScript sources
        id: changed-typescript
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          echo "base-sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          changed_sources="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- 'src/**/*.ts')"
          if [ -n "$changed_sources" ]; then
            echo "has-files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-files=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "files<<EOF"
            printf '%s\n' "$changed_sources"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run related tests for changed TypeScript
        if: steps.changed-typescript.outputs.has-files == 'true'
        env:
          CHANGED_SOURCES: ${{ steps.changed-typescript.outputs.files }}
        run: |
          source_files=()
          while IFS= read -r source_file; do
            source_files+=("$source_file")
          done <<< "$CHANGED_SOURCES"
          bun x vitest related --run -c vitest.workspace.ts "${source_files[@]}"

      - name: Report changed TypeScript coverage
        if: steps.changed-typescript.outputs.has-files == 'true'
        env:
          BASE_SHA: ${{ steps.changed-typescript.outputs.base-sha }}
          CHANGED_SOURCES: ${{ steps.changed-typescript.outputs.files }}
        run: |
          source_files=()
          while IFS= read -r source_file; do
            source_files+=("$source_file")
          done <<< "$CHANGED_SOURCES"
          bun x vitest related --run -c vitest.workspace.ts --coverage.enabled --coverage.changed "$BASE_SHA" --coverage.reporter=text "${source_files[@]}"

  validate-node:
    name: Validate host Node 26
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node 26
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Print host Node version
        run: node --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate host Node and regenerate icons
        run: bun run validate:node

      - name: Verify generated icons are committed
        run: git diff --exit-code
