name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: write

jobs:
  create-version-tag:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Create tag from package.json version
        run: |
          set -euo pipefail
          VERSION="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"

  release:
    # Official tags only: v1.2.3 — exclude develop beta tags (v1.2.3-beta-N)
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-beta-')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      - name: Preflight official release credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          required=(CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required official release credential is missing: $name"
              exit 1
            fi
          done
          expected_tag="v$(bun -e 'const packageInfo = await Bun.file("package.json").json(); process.stdout.write(packageInfo.version)')"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $expected_tag"
            exit 1
          fi

      - name: Build, sign, notarize, and package
        # package uses --publish never; softprops owns GitHub release asset upload
        run: bun run package
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Verify release containers
        run: bun run verify:macos-release

      - name: Create release checksums
        run: |
          set -euo pipefail
          shasum -a 256 \
            dist/GogMeet-*-arm64.dmg \
            dist/GogMeet-*-arm64.zip \
            dist/GogMeet-*-x64.dmg \
            dist/GogMeet-*-x64.zip \
            > dist/SHA256SUMS.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          token: ${{ github.token }}
          files: |
            dist/GogMeet-*-arm64.dmg
            dist/GogMeet-*-arm64.zip
            dist/GogMeet-*-x64.dmg
            dist/GogMeet-*-x64.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: true
